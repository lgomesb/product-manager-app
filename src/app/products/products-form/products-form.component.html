<h1 class="mt-4">Product</h1>
<ol class="breadcrumb mb-4">
    <li class="breadcrumb-item active">{{ product.id ? 'Edit' : 'Create'}}</li>
</ol>
<div class="container">
    <form #productForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class="col-md-12">
                <div class="alert alert-success" role="alert" *ngIf="success == true">
                    Product created/updated successfully!
                </div>
                <div class="alert alert-danger" role="alert" *ngFor="let erro of errors">
                    {{erro}}
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label>ID:</label>
                    <input type="text" class="form-control" [ngModel]="product.id" name="id" disabled="true" />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" class="form-control" [(ngModel)]="product.name" name="name" />
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label>Category:</label>
                    <div class="input-group">
                        <input type="text" class="form-control" [ngModel]="product.category? product.category.name : ''"
                            name="categoryName" disabled="true" />
                        <button type="button" class="btn btn-secondary" (click)="openSearchDialog()">
                            <i class="fa fa-search"></i>
                        </button>
                    </div>
                    <!-- <div class="form-group">

                    <select class="form-control" name="categories" [(ngModel)]="product.category" 
                        (ngModelChange)="onCategoryChange($event)" >

                        <option *ngFor="let category of categories" 
                            [ngValue]="category" name="category">{{ category.name }}</option>

                      </select>

                </div> -->
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <button type="submit" class="btn btn-success">
                    <i class="fa fa-save"></i> Salve
                </button>
                <button type="button" class="btn btn-danger ml-1" (click)="rollbackProductsList()">
                    <i class="fa fa-arrow-alt-circle-left"></i> Back
                </button>
            </div>
        </div>
    </form>
</div>
